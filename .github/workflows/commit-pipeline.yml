name: EuroSAT timed commits

on:
  # A lightweight check: a commit is made only after two hours have elapsed.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      queue_payload:
        description: 'Setup only: base64 gzip of the reviewed nine-change queue; leave empty to check the next commit'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: eurosat-timed-commits
  cancel-in-progress: false

jobs:
  next-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check timing and completion
        id: timing
        run: python scripts/commit_queue.py status
      - name: Validate setup payload
        if: inputs.queue_payload != '' && steps.timing.outputs.done != 'true'
        env:
          QUEUE_PAYLOAD: ${{ inputs.queue_payload }}
        run: python scripts/commit_queue.py bootstrap
      - name: Store pending changes outside commit history
        if: inputs.queue_payload != '' && steps.timing.outputs.done != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eurosat-commit-queue
          path: .automation-local/queue/queue.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Download the reviewed queue
        if: inputs.queue_payload == '' && steps.timing.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          run_id=$(gh api "repos/$GH_REPO/actions/artifacts?name=eurosat-commit-queue&per_page=100" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id')
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo 'The queue artifact is missing. Re-run setup with the saved payload.' >&2
            exit 1
          fi
          gh run download "$run_id" --name eurosat-commit-queue --dir .automation-local/queue
      - name: Publish one commit
        if: inputs.queue_payload == '' && steps.timing.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/commit_queue.py apply
      - name: Check final state
        id: final
        run: python scripts/commit_queue.py status
      - name: Disable the finished pipeline
        if: steps.final.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/commit-pipeline.yml/disable"
